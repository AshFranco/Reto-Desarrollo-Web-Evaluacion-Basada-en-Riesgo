name: Bug
description: Algo no funciona como deberia
labels: [bug]
body:
  - type: textarea
    id: esperado
    attributes: { label: Que deberia pasar }
    validations: { required: true }
  - type: textarea
    id: ocurre
    attributes: { label: Que pasa en realidad }
    validations: { required: true }
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      value: |
        1.
        2.
  - type: dropdown
    id: severidad
    attributes:
      label: Severidad
      options: [Critico, Mayor, Menor]
    validations: { required: true }
