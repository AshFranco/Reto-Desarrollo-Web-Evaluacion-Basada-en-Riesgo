name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  motor-riesgo:
    name: Motor de riesgo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/risk-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci || npm install
      - name: Verificacion de tipos
        run: npx tsc --noEmit
      - name: Pruebas del motor
        run: npx vitest run

  base-de-datos:
    name: Esquema y seeds
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ebr
          POSTGRES_DB: ebr
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Cargar esquema, seeds y funciones
        env:
          PGPASSWORD: ebr
        run: |
          for f in db/0[1-5]_*.sql; do
            echo "--> $f"
            psql -h localhost -U postgres -d ebr -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Ejecutar pruebas del motor en SQL
        env:
          PGPASSWORD: ebr
        run: psql -h localhost -U postgres -d ebr -v ON_ERROR_STOP=1 -f db/opcional/06_pruebas.sql

  esquema-prisma:
    name: Esquema Prisma (migraciones + seed reales)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ebr
          POSTGRES_DB: ebr_bpm
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ebr@localhost:5432/ebr_bpm?schema=public
      SEED_ADMIN_EMAIL: admin.ci@ebr-bpm.test
      SEED_ADMIN_PASSWORD: CiSoloParaPruebasNoUsarEnProd2026!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # El monorepo no tiene package-lock.json en la raiz (solo
      # packages/risk-engine trae el suyo propio), asi que npm ci no aplica
      # aqui; npm install corre en la raiz para que los workspaces
      # (@ebr/risk-engine, etc.) queden enlazados correctamente.
      - run: npm install
      - name: Generar Prisma Client (prisma/seed.ts lo importa directamente)
        working-directory: apps/api
        run: npx prisma generate
      - name: Aplicar migraciones reales de Prisma (lo que realmente usa el backend)
        working-directory: apps/api
        run: npx prisma migrate deploy
      - name: Ejecutar seed real (prisma/seed.ts)
        working-directory: apps/api
        run: npx prisma db seed

  pruebas-backend:
    name: Pruebas backend (NestJS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Generar Prisma Client (PrismaService lo extiende directamente)
        working-directory: apps/api
        run: npx prisma generate
      - name: Verificacion de tipos
        working-directory: apps/api
        run: npx tsc --noEmit
      - name: Pruebas unitarias (Jest)
        working-directory: apps/api
        run: npx jest

  pruebas-frontend:
    name: Pruebas frontend (PWA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Construir @ebr/risk-engine (apps/web lo resuelve via dist/, no src/)
        run: npm run build:engine
      - name: Verificacion de tipos
        working-directory: apps/web
        run: npx tsc --noEmit
      - name: Pruebas unitarias (Vitest)
        working-directory: apps/web
        run: npx vitest run

  politica-de-commits:
    name: Autoria de commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Verificar que ningun commit atribuya autoria a IA
        run: |
          RANGO="${{ github.event.pull_request.base.sha }}..${{ github.sha }}"
          [ -z "${{ github.event.pull_request.base.sha }}" ] && RANGO="HEAD~1..HEAD"
          if git log --format='%an%n%ae%n%b' "$RANGO" 2>/dev/null \
             | grep -iE 'claude|anthropic|copilot|chatgpt|openai'; then
            echo "::error::Hay commits que atribuyen autoria a una herramienta de IA."
            exit 1
          fi
          echo "Autoria de commits correcta."
